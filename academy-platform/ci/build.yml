name: build-and-test

on:
  push:
  workflow_dispatch:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: academy
          POSTGRES_PASSWORD: change_me
          POSTGRES_DB: academy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U academy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://academy:change_me@localhost:5432/academy_test
    defaults:
      run:
        working-directory: academy-platform/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm test

  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: academy-platform/android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: academy-debug-apk
          path: academy-platform/android-app/app/build/outputs/apk/debug/app-debug.apk
